<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Álbum com 10 fotografias do Grêmio Foot-Ball Porto Alegrense, organizado com CSS Grid.">
    <title>Grêmio | Álbum de fotografias</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<!-- Cada fotografia ocupa uma quantidade diferente de linhas ou colunas. -->
        <section class="galeria" id="album" aria-label="Álbum com 10 fotografias do Grêmio">
            <figure class="foto foto--destaque">
                <img src="imagens/gremio-1.jpg" alt="Treino do Grêmio na preparação para enfrentar o Atlético Mineiro">
            </figure>
            <figure class="foto">
                <img src="imagens/gremio-2.jpg" alt="Preparação do Grêmio para enfrentar o Botafogo">
            </figure>
            <figure class="foto foto--alta">
                <img src="imagens/gremio-3.jpg" alt="Atividade do elenco do Grêmio no centro de treinamento">
            </figure>
            <figure class="foto">
                <img src="imagens/gremio-4.jpg" alt="Equipe sub-14 do Grêmio na competição Conmebol Evolución" loading="lazy">
            </figure>
            <figure class="foto foto--larga">
                <img src="imagens/gremio-5.jpg" alt="Elenco do Grêmio em preparação para uma decisão" loading="lazy">
            </figure>
            <figure class="foto">
                <img src="imagens/gremio-6.jpg" alt="Equipe feminina do Grêmio no Campeonato Brasileiro" loading="lazy">
            </figure>
            <figure class="foto foto--alta">
                <img src="imagens/gremio-7.jpg" alt="Grêmio na Copa Sul-Americana" loading="lazy">
            </figure>
            <figure class="foto">
                <img src="imagens/gremio-8.jpg" alt="Representantes de clubes em visita ao CT Cristal do Grêmio" loading="lazy">
            </figure>
            <figure class="foto foto--larga">
                <img src="imagens/gremio-9.jpg" alt="Marlon em notícia do Grêmio" loading="lazy">
            </figure>
            <figure class="foto">
                <img src="imagens/gremio-10.jpg" alt="Treino do Grêmio na preparação para enfrentar o Sport" loading="lazy">
            </figure>
        </section>
    </main>
</body>
</html>
